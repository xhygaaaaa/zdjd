                answer: "潜意识广告基本无效!虽然人眼确实能感知快速闪现的图像,但'在电影中插入1帧可乐广告让人想喝可乐'的实验是伪造的。1957年詹姆斯·维卡里宣称这个实验成功,后来他承认数据是编的。",
                truth: "潜意识广告效果被严重夸大,原始实验是伪造的。",
                origin: "1957年维卡里的虚假实验,后来承认造假但概念已传播开。",
                why: "'潜意识控制'很神秘吸引人,广告业愿意相信有捷径影响消费者。",
                source: "心理学 · 广告学研究",
                confidence: "high",
                related: [19, 21, 27]
            }
        };

        let currentCategory = 'all';

        // 渲染卡片
        function renderCards(category = 'all') {
            const cardsGrid = document.getElementById('cardsGrid');
            cardsGrid.innerHTML = '';

            // 根据分类筛选数据
            const filteredData = category === 'all'
                ? Object.values(knowledgeData)
                : Object.values(knowledgeData).filter(item => item.category === category);

            // 显示卡片
            filteredData.forEach(item => {
                const card = document.createElement('div');
                card.className = 'knowledge-card';
                card.onclick = () => showDetail(item.id);
                card.innerHTML = `
                    <div class="card-title">${item.title}</div>
                    <div class="card-preview">${item.preview}</div>
                `;
                cardsGrid.appendChild(card);
            });

            // 更新主题标题
            const themeHeader = document.querySelector('.theme-header h2');
            if (category === 'all') {
                themeHeader.innerHTML = '今日主题 · 海洋动物';
            } else {
                themeHeader.innerHTML = `今日主题 · ${categories[category].name}`;
            }
        }

        // 显示详细内容
        function showDetail(id) {
            const data = knowledgeData[id];
            const answerContent = document.getElementById('answerContent');

            let html = '<div class="answer-section fade-in">';

            // 真假判断 - 所有类型都显示（如果有verdict）
            if (data.verdict) {
                const verdictClass = data.verdict === 'fake' ? 'fake' : data.verdict === 'true' ? 'true' : 'partial';
                const verdictText = data.verdict === 'fake' ? '假的!' : data.verdict === 'true' ? '真的!' : '部分正确';
                const verdictIcon = data.verdict === 'fake' ? '🔴' : data.verdict === 'true' ? '🟢' : '🟡';

                html += `
                    <div class="verdict ${verdictClass}">
                        ${verdictIcon} 真的假的? → ${verdictText}
                    </div>
                `;
            }

            // 真相/答案
            if (data.truth) {
                html += `
                    <div class="truth-section">
                        <div class="section-title">✅ 真相</div>
                        <div class="section-content">
                            <p>${data.truth}</p>
                            <span class="source-tag">📚 来源: ${data.source}</span>
                        </div>
                    </div>
                `;
            } else {
                html += `
                    <div class="truth-section">
                        <div class="section-title">💡 答案</div>
                        <div class="section-content">
                            <p>${data.answer}</p>
                            <span class="source-tag">📚 来源: ${data.source}</span>
                        </div>
                    </div>
                `;
            }

            // 误解溯源(仅辟谣类显示)
            if (data.type === 'debunk' && data.origin) {
                html += `
                    <div class="origin-section">
                        <div class="section-title">🕵️ 误解从哪来</div>
                        <div class="section-content">
                            <p><strong>起源:</strong> ${data.origin}</p>
                            <p><strong>为什么流传:</strong> ${data.why}</p>
                        </div>
                    </div>
                `;
            }

            // 置信度
            const confidenceClass = data.confidence === 'high' ? 'high' : 'medium';
            const confidenceText = data.confidence === 'high' ? '🟢 确证 · 有权威来源' : '🟡 趣味参考 · 建议核实';
            html += `
                <div class="confidence-badge ${confidenceClass}">
                    ${confidenceText}
                </div>
            `;

            html += '</div>';

            // 相关推荐
            html += '<div class="related-questions fade-in"><h3>💡 你可能还想知道</h3>';
            data.related.forEach(relatedId => {
                if (knowledgeData[relatedId]) {
                    html += `
                        <div class="related-item" onclick="showDetail(${relatedId})">
                            ${knowledgeData[relatedId].title}
                        </div>
                    `;
                }
            });
            html += '</div>';

            answerContent.innerHTML = html;

            // 滚动到顶部
            document.querySelector('.answer-panel').scrollTop = 0;
        }

        // 分类切换
        document.querySelectorAll('.category-item').forEach((item, index) => {
            item.addEventListener('click', function() {
                document.querySelectorAll('.category-item').forEach(i => i.classList.remove('active'));
                this.classList.add('active');

                // 根据索引映射分类
                const categoryMap = ['ocean', 'space', 'body', 'plant', 'history', 'food', 'debunk'];
                const selectedCategory = categoryMap[index];
                currentCategory = selectedCategory;
                renderCards(selectedCategory);
            });
        });

        // ============ 后端 API 集成 ============
        // 后端地址：与前端同源（uvicorn 托管）时留空即可；分离部署时改为 http://localhost:8000
        const API_BASE = '';

        // 调用后端多 Agent 问答接口
        async function askBackend(question) {
            const answerContent = document.getElementById('answerContent');
            answerContent.innerHTML = `
                <div class="empty-state">
                    <div class="icon">⏳</div>
                    <p>AI 正在思考…</p>
                    <p style="font-size:12px;">检索 → 判断 → 生成 → 审查</p>
                </div>`;
            try {
                const res = await fetch(API_BASE + '/api/ask', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: question })
                });
                const data = await res.json();
                renderApiAnswer(question, data);
            } catch (e) {
                answerContent.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">⚠️</div>
                        <p>连不上后端服务</p>
                        <p style="font-size:12px;">请先启动：uvicorn main:app --port 8000</p>
                    </div>`;
            }
        }

        // 渲染后端返回的多 Agent 结果（对应 PRD 第六章回答结构）
        function renderApiAnswer(question, data) {
            const answerContent = document.getElementById('answerContent');
            let html = '<div class="answer-section fade-in">';

            // 真假判断
            if (data.verdict) {
                const map = {
                    fake:    ['fake',    '🔴', '假的!'],
                    'false': ['fake',    '🔴', '假的!'],
                    true:    ['true',    '🟢', '真的!'],
                    partial: ['partial', '🟡', '部分正确']
                };
                const [cls, icon, text] = map[data.verdict] || ['partial', '🟡', '待考证'];
                html += `<div class="verdict ${cls}">${icon} 真的假的? → ${text}</div>`;
            } else if (data.refused) {
                html += `<div class="verdict unknown">🚫 无法判断 · 没有找到可靠依据</div>`;
            } else if (data.evidence_source === 'web') {
                // 联网结果没有经过人工核校，不判真假，只标“搜索结果”
                const strong = data.confidence === 'high';
                html += `<div class="verdict ${strong ? 'explain' : 'unknown'}">
                    🔎 搜索结果 · ${strong ? '有权威来源支撑' : '未确认来源'}</div>`;
            } else {
                // 用户问的是“是什么/为什么/怎么做”，回答的是知识，不是真假
                html += `<div class="verdict explain">💡 问题讲解</div>`;
            }

            // 主体回答（科普 / 辟谣 Agent 输出）
            html += `
                <div class="truth-section">
                    <div class="section-title">💡 AI 解析</div>
                    <div class="section-content">
                        <p>${data.answer || '（暂无回答）'}</p>
                        ${data.source ? `<span class="source-tag">📚 来源: ${data.source}</span>` : ''}
                    </div>
                </div>`;

            // 联网搜索结果（本地库未命中时），逐条可点，方便用户自己核实
            if (data.web_results && data.web_results.length) {
                html += `<div class="origin-section">
                    <div class="section-title">🔗 搜索结果（点开可核实）</div>
                    <div class="section-content">`;
                data.web_results.forEach((r, i) => {
                    const tag = r.authoritative ? ' · 权威来源' : '';
                    html += `<p style="margin:6px 0;font-size:13px;">
                        [${i + 1}] <a href="${r.url}" target="_blank" rel="noopener"
                            style="color:#64b5f6;text-decoration:none;">${r.title}</a>
                        <span style="color:#78909c;font-size:12px;">${tag}</span>
                    </p>`;
                });
                html += `</div></div>`;
            }

            // 误解溯源（辟谣链路特有，PRD 亮点）
            if (data.origin || data.why) {
                const prov = data.origin_provenance === 'knowledge_base'
                    ? '知识库原文' : data.origin_provenance === 'llm_inference'
                    ? '模型推断，非知识库原文' : '';
                html += `
                    <div class="origin-section">
                        <div class="section-title">🕵️ 误解从哪来</div>
                        <div class="section-content">
                            ${data.origin ? `<p><strong>起源:</strong> ${data.origin}</p>` : ''}
                            ${data.why ? `<p><strong>为什么流传:</strong> ${data.why}</p>` : ''}
                            ${prov ? `<p style="font-size:12px;color:#78909c;">溯源方式：${prov}</p>` : ''}
                        </div>
                    </div>`;
            }

            // 证据链：逐条列出检索到的依据，可核实
            if (data.evidence_chain && data.evidence_chain.length) {
                html += `<div class="origin-section">
                    <div class="section-title">🧾 证据链（${data.evidence_chain.length} 条）</div>
                    <div class="section-content">`;
                data.evidence_chain.forEach((e, i) => {
                    const title = e.url
                        ? `<a href="${e.url}" target="_blank" rel="noopener"
                              style="color:#64b5f6;text-decoration:none;">${e.title}</a>`
                        : `${e.title}`;
                    const related = e.verdict
                        ? ` · 库内结论：${e.verdict === 'true' ? '真' : e.verdict === 'fake' ? '假' : '部分正确'}`
                        : '';
                    html += `<p style="margin:8px 0;font-size:13px;">
                        [${i + 1}] ${title}
                        <span style="color:#78909c;font-size:12px;">${e.source || ''}${related}</span>
                        <br><span style="color:#b0bec5;font-size:12px;">${e.snippet || ''}</span>
                    </p>`;
                });
                html += `</div></div>`;
            }

            // 生成后核查：回答是否真的被证据支撑（不只是检索命中）
            if (data.verification && data.verification.support_ratio != null) {
                const ratio = Math.round(data.verification.support_ratio * 100);
                const vcls = ratio >= 80 ? 'high' : ratio >= 50 ? 'medium' : 'low';
                const missing = (data.verification.unsupported_claims || []).length;
                html += `<div class="confidence-badge ${vcls}">
                    🔍 生成后核查：证据支撑 ${ratio}%
                    ${missing ? ` · ${missing} 条主张缺证据` : ''}
                    <span style="font-size:11px;opacity:.8;">（${data.verification.mode}）</span>
                </div>`;
            }

            // 置信度（审查 Agent，PRD 第七章三级置信度）
            const cls = data.confidence === 'high' ? 'high'
                : data.confidence === 'low' ? 'low' : 'medium';
            html += `<div class="confidence-badge ${cls}">${data.confidence_label || ''}</div>`;

            // 调试信息：命中条数 + 编排轨迹 + 当前模型（面试时可展示架构在工作）
            const trace = (data.agent_trace || [])
                .map(t => `${t.agent} ${t.ms}ms`).join(' → ');
            html += `<p style="font-size:11px;color:#78909c;margin-top:10px;">
                🔀 意图: ${data.intent === 'verify' ? '求证真假' : '询问知识'}
                ｜ 路由: ${data.route === 'debunk' ? '辟谣链路' : '冷知识链路'}
                ｜ 来源: ${data.evidence_source === 'web' ? '联网搜索' : data.evidence_source === 'none' ? '无' : '本地知识库'}
                ｜ 命中知识库: ${data.materials_hit} 条
                ${data.refused ? '｜ 🚫 无可靠证据，已拒答' : ''}
                ｜ 模型: ${data.provider}
                ${trace ? `<br>⛓️ 编排轨迹: ${trace}` : ''}</p>`;
            html += '</div>';

            // 延伸推荐（延伸 Agent）
            if (data.related && data.related.length) {
                html += '<div class="related-questions fade-in"><h3>💡 你可能还想知道</h3>';
                data.related.forEach(title => {
                    html += `<div class="related-item" onclick="document.querySelector('.search-input').value='${title.replace(/'/g, "")}';document.querySelector('.search-btn').click();">${title}</div>`;
                });
                html += '</div>';
            }

            answerContent.innerHTML = html;
            document.querySelector('.answer-panel').scrollTop = 0;
        }

        // 搜索功能：点击按钮 / 回车 都触发后端调用
        document.querySelector('.search-btn').addEventListener('click', function() {
            const input = document.querySelector('.search-input');
            if (input.value.trim()) askBackend(input.value.trim());
        });
        document.querySelector('.search-input').addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && this.value.trim()) askBackend(this.value.trim());
        });

        // 页面加载时渲染卡片（默认显示海洋动物分类）
        window.addEventListener('DOMContentLoaded', () => {
            renderCards('ocean');
        });
    </script>
</body>
</html>
